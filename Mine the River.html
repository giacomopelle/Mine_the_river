<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mine the River</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: control bar + scoreboard above one wide animated side view of the river; status chips below. */
:root{
  --bg:#FBF3E4; --worker:#2B6CA3; --ink:#1E2A3A; --muted:#7D7462; --rule:#EADCC2; --card:#FFFCF5;
  --sky1:#B9E1F2; --sky2:#FFF1DA; --land:#8CBB68; --land2:#6C9C4B; --sand:#F2D59B; --sand2:#DCAF63; --aq:#9CD0E6; --rock:#857F8C;
  --river:#1C86C8; --cut:#D9432F; --accent:#135E8C; --truck:#F58A24; --truck2:#C8640E; --good:#2E8B57; --cloud:#FFFFFF; --rain:#4F8FD1;
  --f-display:"Fredoka","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"Fredoka","Avenir Next",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171F; --worker:#7FB3DE; --ink:#EEE8DC; --muted:#A79F8F; --rule:#2E3440; --card:#1B212B;
  --sky1:#1A2B3A; --sky2:#13171F; --land:#4E6338; --land2:#3E5030; --sand:#6E5A35; --sand2:#5C4B2C; --aq:#2F5F82; --rock:#4F555A;
  --river:#4FA3DB; --cut:#F06B55; --accent:#5EB4E3; --truck:#F0A048; --truck2:#C9772E; --good:#5CC48A; --cloud:#3A4A55; --rain:#7FB0E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171F; --worker:#7FB3DE; --ink:#EEE8DC; --muted:#A79F8F; --rule:#2E3440; --card:#1B212B;
  --sky1:#1A2B3A; --sky2:#13171F; --land:#4E6338; --land2:#3E5030; --sand:#6E5A35; --sand2:#5C4B2C; --aq:#2F5F82; --rock:#4F555A;
  --river:#4FA3DB; --cut:#F06B55; --accent:#5EB4E3; --truck:#F0A048; --truck2:#C9772E; --good:#5CC48A; --cloud:#3A4A55; --rain:#7FB0E0; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(1200px 500px at 15% -10%,color-mix(in srgb,var(--sky1) 55%,transparent),transparent 70%),radial-gradient(900px 500px at 100% 0%,color-mix(in srgb,var(--sand) 45%,transparent),transparent 70%);background-attachment:fixed;min-height:100vh;color:var(--ink);font-family:var(--f-display)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 22px;display:grid;gap:12px}
.wrap>*{min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-weight:700;font-size:clamp(1.4rem,3.2vw,2.1rem);margin:0;letter-spacing:-.01em;margin-right:auto}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stopbtn{margin-left:10px;height:40px;padding:0 18px;border-radius:20px;border:0;background:var(--cut);color:#fff;box-shadow:0 4px 12px -4px var(--cut);font:600 .95rem var(--f-display);cursor:pointer}.stopbtn:hover{filter:brightness(1.08)}
.lbl{font:500 .78rem var(--f-mono);color:var(--muted)}
.step{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);box-shadow:0 3px 8px -4px rgba(60,40,10,.4);background:var(--card);color:var(--ink);font:700 1.3rem var(--f-mono);cursor:pointer;line-height:1}
.n{font:700 1.6rem var(--f-mono);min-width:2.2ch;text-align:center}
.play{font:700 1rem var(--f-display);border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:var(--bg);cursor:pointer;min-width:96px}
.ghost{font:600 .9rem var(--f-display);border:1.5px solid var(--rule);border-radius:999px;padding:8px 14px;background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--cut);outline-offset:2px}
.score{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 14px}
.k{font:500 .72rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.v{font:700 clamp(1.1rem,2.6vw,1.6rem) var(--f-mono);margin-top:2px;white-space:nowrap}
.v small{font-size:.6em;color:var(--muted);font-weight:500}
.bal{height:8px;border-radius:4px;background:var(--rule);margin-top:6px;overflow:hidden;display:flex}
.bal i{display:block;height:100%}
svg{display:block;width:100%;height:auto;border-radius:18px}
.view svg{box-shadow:0 6px 22px -10px rgba(60,40,10,.35),0 0 0 1px var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .85rem var(--f-display);border-radius:999px;padding:6px 12px;border:1.5px solid var(--rule);background:var(--card);display:inline-flex;align-items:center;gap:6px}
.chip b{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block}
.chip.bad{border-color:var(--cut);color:var(--cut)} .chip.bad b{background:var(--cut)}
.view{position:relative}.tag{position:absolute;left:12px;top:8px;font:700 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--card);padding:3px 8px;border-radius:999px;z-index:1}
#plan{border-radius:16px}
#bal{width:min(520px,100%);height:auto}.balrow{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:10px 16px;box-shadow:0 6px 22px -14px rgba(60,40,10,.35);display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}.yr{font:600 1rem var(--f-display);color:var(--muted);margin-bottom:4px}.yr b{font-size:2.4rem;color:var(--ink);font-variant-numeric:tabular-nums}.baltxt{font:700 clamp(1.1rem,2.4vw,1.5rem) var(--f-display);max-width:300px}
.msg{font:600 1rem var(--f-display);min-height:1.4em}
.foot{font:500 .7rem var(--f-mono);color:var(--muted)}
@media (max-width:640px){.balrow{gap:4px}.balrow .baltxt{text-align:center;max-width:none}#bal{width:88%}.yr b{font-size:2rem}.score{grid-template-columns:1fr 1fr}.score .card:nth-child(2){grid-column:1/-1;order:3}}
.t{fill:var(--ink);font:600 15px var(--f-display)} .tm{fill:var(--muted);font:500 12px var(--f-mono)}
</style>

<div class="wrap" lang="en">
  <div class="top">
    <h1>Mine the river</h1>
    <div class="ctl"><span class="lbl">trucks / day</span>
      <button class="step" id="minus" aria-label="Fewer trucks">−</button><span class="n" id="n" aria-live="polite">5</span><button class="step" id="plus" aria-label="More trucks">+</button><button class="stopbtn" id="stop">Stop mining</button></div>
  </div>
  <div class="balrow"><svg id="bal" viewBox="0 -5 600 210" role="img" aria-label="Balance between the sand the river brings and the sand the trucks take"></svg><div id="balTxt" class="baltxt"></div></div>
  <div class="view"><span class="tag">Top view</span><svg id="plan" viewBox="275 0 650 150" role="img" aria-label="River seen from above: a wide braided channel that narrows where the bed sinks"></svg></div>
  <div class="view"><span class="tag">Side view</span><svg id="fig" viewBox="0 0 1200 560" role="img" aria-label="Animated side view of a river: floods bring sand from upstream, trucks dig sand from the riverbed, and the bed, water table and well respond."></svg></div>
  <div class="chips" id="chips"></div>
  <div class="msg" id="msg" hidden></div>
</div>

<script>
/* ---------------- model ---------------- */
const L=40000,N=121,dx=L/(N-1),S0=0.004,K0=0.4e6,ALLUV=7,X1=15000,X2=25000,YEARS=30,NEQ=4;
const x=Array.from({length:N},(_,i)=>i*dx), z0=x.map(v=>S0*(L-v)), zb=z0.map(v=>v-ALLUV);
const inM=x.map(v=>v>=X1&&v<=X2), Lm=inM.filter(Boolean).length*dx, qMean=K0*S0;
// flood factor: low flow most of the time, 3 floods a year (mean = 1)
const FL=[0.2,0.7], SIG=0.03, AMP=0.465/(SIG*Math.sqrt(2*Math.PI)), BASE=0.07;
function phi(t){const f=t-Math.floor(t);let s=BASE;for(const c of FL){for(const o of[-1,0,1]){const u=(f-c-o)/SIG;s+=AMP*Math.exp(-0.5*u*u)*(1+0.35*Math.sin(7.3*Math.floor(t)+c*10));}}return s;}
const DT=0.35*dx*dx/(K0*(AMP*1.4+BASE));
let S;
function reset(){S={z:z0.slice(),t:0,brought:0,took:0,lag:0,money:0,run:false,done:false};}
const LS=1000; // pickup length: clear water leaving the pit regains its load over a few km ("hungry water")
function step(dt,n){
  const z=S.z,q=new Float64Array(N-1),ph=phi(S.t),K=K0*ph,qin=K*S0,eRate=n/NEQ*qMean/Lm, a=Math.min(1,dx/LS);
  let qp=qin;
  for(let i=0;i<N-1;i++){const s=(z[i]-z[i+1])/dx, qc=s>0?K*s:0; qp=qp+(qc-qp)*a; q[i]=qp;}
  let took=0;
  for(let i=0;i<N-1;i++){
    let v=z[i]-(q[i]-(i?q[i-1]:qin))/dx*dt;
    if(inM[i]){const ex=Math.min(eRate*dt,Math.max(v-zb[i],0));v-=ex;took+=ex*dx;}
    z[i]=Math.max(v,zb[i]);
  }
  z[N-1]=z0[N-1];
  S.brought+=qin*dt; S.took+=took; S.lag+=q[N-2]*dt; S.t+=dt;
  return ph;
}
/* ---------------- drawing helpers ---------------- */
const W=1200,H=560,PT=170,PB=20,TILT=14,BANK=3.5,ROAD=1.2;
const XS=v=>20+v/L*(W-40);
const YT=TILT+BANK+6, YB=-ALLUV-3;
const YS=v=>PT+(YT-v)/(YT-YB)*(H-PT-PB);
const dz=(v,i)=>(v-z0[i])+TILT*(L-x[i])/L;
const P=a=>a.map((v,i)=>(i?'L':'M')+XS(x[i]).toFixed(1)+','+YS(v).toFixed(1)).join('');
const back=a=>{let s='';for(let i=N-1;i>=0;i--)s+='L'+XS(x[i]).toFixed(1)+','+YS(a[i]).toFixed(1);return s;};
const interp=(a,xx)=>{const f=xx/dx,i=Math.min(N-2,Math.max(0,Math.floor(f))),r=f-i;return a[i]*(1-r)+a[i+1]*r;};
const WELL=12500;
/* static scene pieces */
const svg=document.getElementById('fig');
svg.innerHTML=`<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient>
 <pattern id="grav" width="14" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="var(--sand2)"/><circle cx="10" cy="7" r="1.2" fill="var(--sand2)"/></pattern>
 <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="var(--river)"/></marker><g id="truck"><rect x="-26" y="-20" width="34" height="14" rx="2" fill="var(--truck)"/><path d="M8,-6 L8,-18 L18,-18 L24,-11 L24,-6 Z" fill="var(--truck2)"/><path d="M11,-16 L17,-16 L21,-11 L11,-11Z" fill="var(--sky1)"/>
   <rect x="-28" y="-7" width="54" height="3" rx="1.5" fill="var(--ink)" opacity=".7"/><circle cx="-17" cy="-3" r="4.5" fill="var(--ink)"/><circle cx="0" cy="-3" r="4.5" fill="var(--ink)"/><circle cx="17" cy="-3" r="4.5" fill="var(--ink)"/></g>
</defs><rect width="${W}" height="${H}" fill="url(#sky)"/><g id="cl"></g><g id="land"></g><g id="parts"></g><g id="obj"></g><g id="trucks"></g><g id="lab"></g>`;
const gCl=svg.querySelector('#cl'),gLand=svg.querySelector('#land'),gParts=svg.querySelector('#parts'),gObj=svg.querySelector('#obj'),gTr=svg.querySelector('#trucks'),gLab=svg.querySelector('#lab');
let nTr=5, nAct=5, stopY=null, parts=[], tReal=0, flS=0, planTr=[];
const $=id=>document.getElementById(id);
function wtOf(bed){const stage=bed.map(v=>v+1.2);return stage.map((v,i)=>{let s=0,c=0;for(let k=-5;k<=5;k++){const j=i+k;if(j>=0&&j<N){s+=stage[j];c++;}}return s/c;});}
function render(ph){
  const z=S.z, bed=z.map(dz), bed0=z0.map(dz), rock=zb.map(dz), fp=z0.map((v,i)=>dz(v,i)+BANK);
  const stage=bed.map(v=>v+1.0+Math.min(ph,6)*0.15), wt=wtOf(bed).map((v,i)=>Math.min(v,fp[i]-0.4)), wt0=wtOf(bed0);
  const bot=YS(YB);
  let g='';
  g+=`<path d="${P(rock)}L${XS(L)},${bot}L${XS(0)},${bot}Z" fill="var(--rock)"/>`;
  g+=`<path d="${P(fp)}${back(rock)}Z" fill="var(--sand)"/><path d="${P(fp)}${back(rock)}Z" fill="url(#grav)" opacity=".7"/>`;
  g+=`<path d="${P(wt)}${back(rock)}Z" fill="var(--aq)" opacity=".75"/>`;
  g+=`<path d="${P(fp.map(v=>v+0.2))}${back(fp.map(v=>v-0.9))}Z" fill="var(--land)"/>`;
  g+=`<path d="${P(bed0)}${back(bed)}Z" fill="var(--sky2)" opacity=".9"/>`;
  g+=`<path d="${P(stage)}${back(bed)}Z" fill="var(--river)" opacity=".9"/>`;
  g+=`<path d="${P(bed0)}" fill="none" stroke="var(--ink)" stroke-width="1.3" stroke-dasharray="5 5" opacity=".45"/>`;
  g+=`<path d="${P(wt)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>`;
  for(let i=0;i<N-1;i++) if(z[i]-zb[i]<0.05) g+=`<line x1="${XS(x[i])}" x2="${XS(x[i+1])}" y1="${YS(bed[i])}" y2="${YS(bed[i+1])}" stroke="var(--cut)" stroke-width="5" stroke-linecap="round"/>`;
  gLand.innerHTML=g;
  // objects: bridge, well, mountains label, mining zone
  let o='';
  const iw=Math.round(WELL/dx), wx=XS(WELL), wTop=YS(fp[iw]+0.9), wBotV=fp[iw]-6, wBot=YS(wBotV), dry=wt[iw]<wBotV+0.3;
  o+=`<rect x="${wx-8}" y="${wTop}" width="16" height="${wBot-wTop}" fill="var(--card)" stroke="var(--ink)" stroke-width="2" rx="2"/>`;
  if(!dry) o+=`<rect x="${wx-6}" y="${YS(wt[iw])}" width="12" height="${Math.max(0,wBot-YS(wt[iw])-1)}" fill="var(--accent)"/>`;
  o+=`<text class="t" x="${wx}" y="${wTop-10}" text-anchor="middle" ${dry?'style="fill:var(--cut)"':''}>${dry?'well dry':'well'}</text>`;
  o+=`<text class="tm" x="${mob?362:XS(9300)}" y="${YS(fp[28])-(mob?30:48)}">↓ sand from upstream</text>`;
  o+=`<rect x="${XS(X1)}" y="${PT-8}" width="${XS(X2)-XS(X1)}" height="5" rx="2.5" fill="var(--truck)"/>`;
  o+=`<text class="tm" x="${(XS(X1)+XS(X2))/2}" y="${PT-16}" text-anchor="middle" style="fill:var(--truck2);font-weight:700">SAND MINE</text>`;
  const inc=z.map((v,i)=>z0[i]-v); let mx=0,im=0; inc.forEach((v,i)=>{if(v>mx){mx=v;im=i;}});
  if(mx>0.3){const X=XS(x[im]), ya=YS(bed0[im]), yb=YS(bed[im]);
    o+=`<line x1="${X}" y1="${ya}" x2="${X}" y2="${yb-4}" stroke="var(--cut)" stroke-width="3"/><path d="M${X-7},${yb-10} L${X},${yb} L${X+7},${yb-10}Z" fill="var(--cut)"/><line x1="${X-10}" y1="${ya}" x2="${X+10}" y2="${ya}" stroke="var(--cut)" stroke-width="3"/>`;
    o+=`<line x1="${X}" y1="${PT+(mob?50:38)}" x2="${X}" y2="${ya}" stroke="var(--cut)" stroke-width="1.5" stroke-dasharray="3 4"/><text x="${mob?Math.max(X,470):X}" y="${PT+(mob?42:30)}" text-anchor="middle" style="fill:var(--cut);font:700 ${mob?20:22}px var(--f-display)">riverbed −${mx.toFixed(1)} m</text>`;}
  { let md=0,id=0; for(let i=0;i<N;i++) if(x[i]>X2+300&&inc[i]>md){md=inc[i];id=i;}
    if(md>0.3){ const xs=x.map((v,i)=>i).filter(i=>x[i]>X2&&inc[i]>0.15); const xa=XS(x[xs[0]]), xb2=XS(x[xs[xs.length-1]]);
      const yl=YS(fp[id])-34, xt=Math.min(xa+20, mob?700:1000);
      if(mob){ const yq=YS(interp(fp,26500))-30;
        o+=`<path d="M690,${yq+12} L800,${yq+12}" stroke="var(--river)" stroke-width="2.5" marker-end="url(#arR)"/><text x="805" y="${yq-16}" text-anchor="end" style="fill:var(--river);font:700 16px var(--f-display)">hungry water</text><text x="805" y="${yq+2}" text-anchor="end" style="fill:var(--river);font:700 16px var(--f-display)">bed −${md.toFixed(1)} m</text>`; }
      else { o+=`<path d="M${xa+10},${yl+12} L${Math.min(xb2,xa+170)},${yl+12}" stroke="var(--river)" stroke-width="2.5" marker-end="url(#arR)"/>`;
      o+=`<text x="${xa+10}" y="${yl}" style="fill:var(--river);font:700 19px var(--f-display);paint-order:stroke;stroke:var(--sky2);stroke-width:4px">hungry water: bed −${md.toFixed(1)} m</text>`; }
} }
  if(z.some((v,i)=>inM[i]&&v-zb[i]<0.05)) o+=`<text class="tm" x="${(XS(X1)+XS(X2))/2}" y="${YS(rock[Math.round((X1+X2)/2/dx)])+40}" text-anchor="middle" style="fill:var(--bg);font-weight:700">bedrock exposed</text>`;
  gObj.innerHTML=o;
  // clouds and rain
  flS+=(Math.min(1,Math.max(0,(ph-1.5)/3))-flS)*0.15; const fl=flS;
  let c='';
  for(const [cx,cy,s] of(mob?[[430,185,.6],[770,180,.6]]:[[300,180,.7],[390,168,.6],[1050,178,.75]])){
    c+=`<g transform="translate(${cx},${cy}) scale(${s})" opacity="${0.55+0.45*fl}"><ellipse cx="0" cy="0" rx="46" ry="18" fill="var(--cloud)"/><ellipse cx="-24" cy="6" rx="30" ry="14" fill="var(--cloud)"/><ellipse cx="28" cy="6" rx="32" ry="14" fill="var(--cloud)"/>${fl>0.05?`<ellipse cx="0" cy="8" rx="60" ry="10" fill="var(--ink)" opacity="${0.18*fl}"/>`:''}</g>`;
    if(fl>0.05) for(let k=0;k<10;k++){const rx=cx-50+k*11+((tReal*900+k*37)%11), ry=cy+18+((tReal*400+k*53)%60);c+=`<line x1="${rx}" y1="${ry}" x2="${rx-4}" y2="${ry+12}" stroke="var(--rain)" stroke-width="2" opacity="${fl}"/>`;}
  }
  if(fl>0.3) c+=`<text x="${mob?640:1050}" y="${mob?200:228}" text-anchor="middle" style="fill:var(--rain);font:700 22px var(--f-display);letter-spacing:.12em">FLOOD</text>`;
  gCl.innerHTML=c;
  // particles (sand moving downstream)
  const spawn=ph*0.9; for(let k=0;k<spawn;k++) if(Math.random()<Math.min(1,spawn-k)) parts.push({x:Math.random()*1500,o:Math.random()});
  let pp='';
  parts=parts.filter(p=>p.x<L);
  for(const p of parts){p.x+=ph*55*(1+0.5*p.o);
    if(inM[Math.round(p.x/dx)]&&Math.random()<nAct/NEQ*0.02){p.x=L+1;continue;}
    const by2=YS(interp(bed,p.x))-2-p.o*5; pp+=`<circle cx="${XS(p.x).toFixed(1)}" cy="${by2.toFixed(1)}" r="${2+p.o*1.6}" fill="var(--sand2)" stroke="var(--ink)" stroke-opacity=".25"/>`;}
  if(parts.length>260) parts.splice(0,parts.length-260);
  gParts.innerHTML=pp;
  // trucks: drive in along the floodplain, go down to the bed, load, drive back
  let tr=''; planTr=[];
  const yRoad=xx=>YS(interp(fp,xx)+0.2);
  for(let k=0;k<nAct;k++){
    const cyc=6, ph2=((tReal+k*cyc/nAct)%cyc)/cyc;
    const xm=X1+((k*3)%nAct+0.5)/nAct*(X2-X1), xe=L+3000;
    let xx,yy,dir,load=false;
    let fill=0;
    if(ph2<0.25){const u=ph2/0.25;xx=xe+(xm-xe)*u;yy=yRoad(xx);dir=-1;}
    else if(ph2<0.32){const u=(ph2-0.25)/0.07;xx=xm;yy=yRoad(xm)+(YS(interp(bed,xm))-yRoad(xm))*u;dir=-1;}
    else if(ph2<0.72){xx=xm;yy=YS(interp(bed,xm));dir=-1;fill=(ph2-0.32)/0.4;load=fill>0.05;}
    else if(ph2<0.79){const u=(ph2-0.72)/0.07;xx=xm;yy=YS(interp(bed,xm))+(yRoad(xm)-YS(interp(bed,xm)))*u;dir=1;load=true;fill=1;}
    else{const u=(ph2-0.79)/0.21;xx=xm+(xe-xm)*u;yy=yRoad(xx);dir=1;load=true;fill=1;}
    const sx=XS(xx); if(ph2>=0.32&&ph2<0.72) planTr.push(xm); if(sx>W+40) continue;
    const pile=load?`<path d="M-24,-20 Q-9,${(-20-12*fill).toFixed(1)} 6,-20Z" fill="var(--sand2)"/>`:'';
    tr+=`<g transform="translate(${sx.toFixed(1)},${yy.toFixed(1)}) scale(${dir*-1},1) scale(.8)"><use href="#truck"/>${pile}</g>`;
    if(ph2>=0.32&&ph2<0.72){ // two paleros shovelling into the truck bed
      for(const [ox,pk] of [[-34,0],[36,0.5]]){
        const sw=(Math.sin((tReal*5+pk*Math.PI*2+k))+1)/2; // 0 = dig, 1 = throw
        tr+=`<g transform="translate(${(sx+ox).toFixed(1)},${yy.toFixed(1)}) scale(${ox<0?1.35:-1.35},1.35)">${palero(sw)}</g>`;
        if(sw>0.8) tr+=`<circle cx="${(sx+ox*0.45).toFixed(1)}" cy="${(yy-26-6*(sw-0.8)/0.2).toFixed(1)}" r="2.4" fill="var(--sand2)"/><circle cx="${(sx+ox*0.35).toFixed(1)}" cy="${(yy-30).toFixed(1)}" r="1.8" fill="var(--sand2)"/>`;
      }
    }
  }
  gTr.innerHTML=tr;
  const wd=interp(wt0,WELL)-interp(wt,WELL), narrow=planDraw(inc);
  const chips=[['Riverbed'+(mx>0.3?' −'+mx.toFixed(1)+' m':''),mx<=0.3],['River width'+(narrow>3?' −'+narrow.toFixed(0)+'%':''),narrow<=3],[dry?'Well dry':'Well',!dry],['Water table'+(wd>0.5?' −'+wd.toFixed(1)+' m':''),wd<=0.5]];
  $('chips').innerHTML=chips.map(([t,ok])=>`<span class="chip ${ok?'':'bad'}"><b></b>${t}</span>`).join('');
  return {mx,dry,narrow};
}
/* ---------------- loop ---------------- */
const traj={};
function run(n){ if(traj[n]) return traj[n]; reset(); const out=[z0.slice()];
  for(let y=1;y<=YEARS;y++){ while(S.t<y-1e-9){step(Math.min(DT,y-S.t),n);} out.push(S.z.slice()); }
  traj[n]=out; return out; }
let year=0, last=null; const YPS=3, REC=40; // years per second; years shown after mining stops
const recT={};
function recov(n,y){const k=n+'_'+y; if(recT[k]) return recT[k]; S={z:run(n)[y].slice(),t:0}; const out=[S.z.slice()];
  for(let j=1;j<=REC;j++){ while(S.t<j-1e-9){step(Math.min(DT,j-S.t),0);} out.push(S.z.slice()); } recT[k]=out; return out;}
function frame(ts){
  if(last===null) last=ts; const dtR=Math.min(0.05,(ts-last)/1000); last=ts; tReal+=dtR;
  const yMax=stopY===null?YEARS:stopY+REC; year=Math.min(yMax,year+dtR*YPS);
  let tr,yy;
  if(stopY===null){tr=run(nTr);yy=year;nAct=nTr;}else{tr=recov(nTr,stopY);yy=year-stopY;nAct=0;}
  const y0=Math.floor(yy), y1=Math.min(tr.length-1,y0+1), f=yy-y0;
  S={z:tr[y0].map((v,i)=>v+(tr[y1][i]-v)*f),t:0};
  const ph=phi(tReal/7);
  const r=render(ph); balance(r);
  requestAnimationFrame(frame);
}
function balance(r){
  const d=nAct-NEQ, ang=Math.max(-12,Math.min(12,d*3)), cx=300, cy=58, arm=190;
  const rad=ang*Math.PI/180, lx=cx-arm*Math.cos(rad), ly=cy-arm*Math.sin(rad), rx=cx+arm*Math.cos(rad), ry=cy+arm*Math.sin(rad);
  const pan=(x,y,col,n,label,fill)=>{let g=`<line x1="${x}" y1="${y}" x2="${x-46}" y2="${y+42}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${x}" y1="${y}" x2="${x+46}" y2="${y+42}" stroke="var(--muted)" stroke-width="1.5"/>`;
    for(let k=0;k<n;k++){const row=Math.floor(k/5),c=k%5,px=x-36+c*18+(row%2)*9,py=y+40-row*11;g+=`<path d="M${px-9},${py} Q${px},${py-16} ${px+9},${py}Z" fill="${fill}"/>`;}
    g+=`<path d="M${x-58},${y+42} Q${x},${y+64} ${x+58},${y+42}Z" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>`;
    g+=`<text x="${x}" y="${y+86}" text-anchor="middle" style="fill:${col};font:600 17px var(--f-display)">${label}</text>`;return g;};
  let g=`<path d="M${cx-26},${cy+92} L${cx+26},${cy+92} L${cx+5},${cy+4} L${cx-5},${cy+4}Z" fill="var(--ink)" opacity=".85"/>`;
  g+=`<line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="8" fill="var(--accent)"/>`;
  g+=pan(lx,ly,'var(--river)',NEQ,'River brings','var(--river)')+pan(rx,ry,'var(--truck2)',nAct,'Trucks take','var(--truck)');
  const ok=nTr<=NEQ;
  document.getElementById('bal').innerHTML=g;
  const st=document.getElementById('balTxt'), y=Math.floor(year), end=(stopY===null?YEARS:stopY+REC);
  let msg,col;
  if(stopY===null){msg=nTr<NEQ?'The river keeps up':nTr===NEQ?'On the edge':'Trucks take more than the river brings';col=ok?'var(--good)':'var(--cut)';}
  else{msg='Mining stopped: the river needs decades to recover';col='var(--river)';}
  st.innerHTML=`<div class="yr">${y===end?'After ':'Year '}<b>${y}</b>${y===end?' years':''}</div><div style="color:${col}">${msg}</div>`;
  const sb=$('stop'); const lab=stopY===null?'Stop mining':'Mine again'; if(sb.textContent!==lab) sb.textContent=lab;
}
function planDraw(inc){
  const cy=75,h0=50, i0=0, i1=N-1;
  const hw=inc.map(v=>h0*(1-0.55*Math.min(1,Math.max(0,v)/7)));
  const nth=inc.map(v=>v<1?3:v<2.5?2:1);
  let g=`<rect x="0" y="0" width="1200" height="150" fill="var(--land)"/>`;
  for(let k=0;k<36;k++){const tx=240+k*26+(k*37%11),ty=12+(k*53%120);g+=`<circle cx="${tx}" cy="${ty}" r="${5+(k%3)*2}" fill="var(--land2)" opacity=".55"/>`;}
  let up='',dn='',o0='',o1='';
  for(let i=i0;i<=i1;i++){const X=XS(x[i]).toFixed(1);const c0=cy+10*Math.sin(x[i]/2600+0.6);up+=(i>i0?'L':'M')+X+','+(c0-hw[i]).toFixed(1);dn='L'+X+','+(c0+hw[i]).toFixed(1)+dn;o0+=(i>i0?'L':'M')+X+','+(cy-h0);o1+=(i>i0?'L':'M')+X+','+(cy+h0);}
  g+=`<path d="${up}${dn}Z" fill="var(--sand)"/><path d="${up}${dn}Z" fill="url(#grav)" opacity=".6"/>`;
  g+=`<path d="${o0}" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 5" opacity=".45"/><path d="${o1}" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 5" opacity=".45"/>`;
  const cl=i=>cy+10*Math.sin(x[i]/2600+0.6), ww=hw.map(v=>v*0.62);
  let u2='',d2='';for(let i=i0;i<=i1;i++){const X=XS(x[i]).toFixed(1);u2+=(i>i0?'L':'M')+X+','+(cl(i)-ww[i]).toFixed(1);d2='L'+X+','+(cl(i)+ww[i]).toFixed(1)+d2;}
  g+=`<path d="${u2}${d2}Z" fill="var(--river)"/>`;
  for(let k=0;k<2;k++){let d='';for(let i=i0;i<=i1;i++)d+=(i>i0?'L':'M')+XS(x[i]).toFixed(1)+','+(cl(i)+(k?0.35:-0.35)*ww[i]).toFixed(1);g+=`<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="14 22"/>`;}
  g+=`<rect x="${XS(X1)}" y="4" width="${XS(X2)-XS(X1)}" height="4" rx="2" fill="var(--truck)"/>`;
  for(const xm of planTr){const X=XS(xm);g+=`<rect x="${X-9}" y="${cy+10*Math.sin(xm/2600+0.6)-5}" width="18" height="10" rx="2" fill="var(--truck)" stroke="var(--truck2)"/><circle cx="${X-14}" cy="${cy-9}" r="3" fill="var(--ink)"/><circle cx="${X+14}" cy="${cy+9}" r="3" fill="var(--ink)"/>`;}
  const iw=Math.round(WELL/dx); g+=`<circle cx="${XS(WELL)}" cy="${cy+h0+16}" r="6" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text class="tm" x="${XS(WELL)+10}" y="${cy+h0+20}" style="fill:var(--ink)">well</text>`;
  const imin=hw.indexOf(Math.min(...hw.slice(i0,i1))), narrow=(1-hw[imin]/h0)*100;
  if(narrow>3) g+=`<text x="${XS(x[imin])}" y="${cy+hw[imin]+22}" text-anchor="middle" style="fill:var(--cut);font:700 15px var(--f-mono)">−${narrow.toFixed(0)}% width</text>`;
  document.getElementById('plan').innerHTML=`<defs><pattern id="grav2" width="14" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="var(--sand2)"/></pattern></defs>`+g.replace(/url\(#grav\)/g,'url(#grav2)');
  return narrow;
}
function palero(sw){ // simple stick figure; sw 0 = shovel down in sand, 1 = shovel up toward truck
  const a=-0.3+sw*1.9, hx=2, hy=-20, sx2=hx+Math.cos(-a)*16, sy2=hy+Math.sin(-a)*16-2;
  const blade=`<path d="M${(hx+Math.cos(-a)*22).toFixed(1)},${(hy+Math.sin(-a)*22).toFixed(1)} l${(Math.cos(-a+0.6)*5).toFixed(1)},${(Math.sin(-a+0.6)*5).toFixed(1)} l${(Math.cos(-a-1.2)*6).toFixed(1)},${(Math.sin(-a-1.2)*6).toFixed(1)}Z" fill="var(--rock)"/>`;
  return `<g stroke="var(--worker)" stroke-width="2.6" stroke-linecap="round" fill="none">
   <line x1="0" y1="-12" x2="-4" y2="0"/><line x1="0" y1="-12" x2="4" y2="0"/>
   <line x1="0" y1="-12" x2="${(1+sw*1.5).toFixed(1)}" y2="-24"/>
   <line x1="${(1+sw*1.5).toFixed(1)}" y1="-22" x2="${sx2.toFixed(1)}" y2="${sy2.toFixed(1)}"/>
   <line x1="${(hx-Math.cos(-a)*6).toFixed(1)}" y1="${(hy-Math.sin(-a)*6).toFixed(1)}" x2="${(hx+Math.cos(-a)*22).toFixed(1)}" y2="${(hy+Math.sin(-a)*22).toFixed(1)}" stroke="var(--truck2)" stroke-width="2"/></g>
   ${blade}<circle cx="${(1+sw*1.5).toFixed(1)}" cy="-28" r="4" fill="var(--worker)"/><path d="M${(sw*1.5-5).toFixed(1)},-30 h12" stroke="var(--truck)" stroke-width="3"/>`;
}
let mob=false;
function fit(){mob=innerWidth<700;svg.setAttribute('viewBox',mob?'350 118 460 332':'240 135 900 310');$('plan').setAttribute('viewBox',mob?'350 0 460 150':'240 0 900 150');}
addEventListener('resize',fit);fit();
function setN(v){nTr=Math.max(0,Math.min(12,v));year=0;stopY=null;$('n').textContent=nTr;
  $('msg').innerHTML=`The river brings sand for about <b>${NEQ} trucks a day</b>. Choose the trucks, watch ${YEARS} years of mining, then press <b>Stop mining</b>.`;}
$('stop').onclick=()=>{if(stopY===null){stopY=Math.floor(year);year=stopY;}else{stopY=null;year=0;}};
$('minus').onclick=()=>setN(nTr-1); $('plus').onclick=()=>setN(nTr+1);
setN(5); requestAnimationFrame(frame);
</script>
